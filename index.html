<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МЕЛАВИ — раскраска из фото</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4d6, #ffd6e7, #d8f5ff);
      color: #242424;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 28px 20px 40px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 15px;
    }

    .subtitle {
      text-align: center;
      margin: 8px 0 25px;
      font-size: 17px;
    }

    .card {
      background: rgba(255,255,255,0.88);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .upload {
      border: 3px dashed #ff6b9a;
      border-radius: 22px;
      padding: 35px 15px;
      text-align: center;
      cursor: pointer;
      background: #fff8fb;
    }

    .upload-icon {
      font-size: 55px;
    }

    .upload-title {
      font-size: 20px;
      font-weight: 700;
      margin-top: 10px;
    }

    .upload-text {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    #photoInput {
      display: none;
    }

    #preview {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 18px;
      margin-top: 18px;
      display: none;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px;
      margin-top: 18px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: #ff4f8b;
      color: white;
    }

    .button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 25px;
      text-align: center;
    }

    .result img {
      width: 100%;
      border-radius: 18px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: 600;
    }

    .privacy {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">МЕЛАВИ</div>

  <div class="subtitle">
    Преврати фотографию в красивую раскраску ✨
  </div>

  <div class="card">

    <label class="upload" for="photoInput">
      <div class="upload-icon">📸</div>

      <div class="upload-title">
        Загрузить фотографию
      </div>

      <div class="upload-text">
        Выбери фото из телефона или компьютера
      </div>
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

    <img id="preview" alt="Предпросмотр">

    <button
      id="makeButton"
      class="button"
      disabled
    >
      ✨ Сделать раскраску
    </button>

    <div id="status" class="status"></div>

    <div id="result" class="result">
      <h2>🎨 Готово!</h2>
      <img id="resultImage" alt="Готовая раскраска">
      <button class="button" onclick="resetApp()">
        📸 Загрузить другое фото
      </button>
    </div>

  </div>

  <div class="privacy">
    Фотография используется только для создания раскраски.
  </div>

</div>

<script>

  const photoInput = document.getElementById("photoInput");
  const preview = document.getElementById("preview");
  const makeButton = document.getElementById("makeButton");
  const status = document.getElementById("status");

  photoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const imageUrl = URL.createObjectURL(file);

    preview.src = imageUrl;
    preview.style.display = "block";

    makeButton.disabled = false;

    status.textContent = "Фото загружено. Можно создавать раскраску ✨";
  });


  makeButton.addEventListener("click", async function () {

    if (!photoInput.files[0]) return;

    status.textContent = "Создаём раскраску… 🎨";
    makeButton.disabled = true;

    /*
      Здесь позже подключим настоящий AI.

      Пока это только интерфейс.
    */

    setTimeout(function () {

      status.textContent =
        "Интерфейс готов. Следующим шагом подключим AI.";

      makeButton.disabled = false;

    }, 1500);

  });


  function resetApp() {

    photoInput.value = "";
    preview.style.display = "none";
    makeButton.disabled = true;

    document.getElementById("result").style.display = "none";

    status.textContent = "";

  }

</script>

</body>
</html>
